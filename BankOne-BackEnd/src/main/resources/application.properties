spring.application.name=BankOne

# Override with env vars in cloud / Docker (see .env.example / docs/DEPLOY.md)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankone_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BankOne@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Instant/OffsetDateTime already serialize as ISO-8601 with Z (UTC).
# Do not set spring.jackson.serialization.write-dates-as-timestamps —
# Spring Boot 4 / Jackson 3 rejects that legacy property and the app fails to start.
spring.jackson.time-zone=UTC

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# Cloud hosts often set PORT
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:ReplaceThisWithAVeryLongRandomSecretKeyAtLeast32CharactersLong}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Comma-separated origin patterns for CORS
app.cors.allowed-origin-patterns=${APP_CORS_ORIGINS:http://localhost:*,http://bankone.local:*,http://192.168.0.4:*}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LEVEL:TRACE}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}


# --- Kafka notifications (Liberty local; override on Render with env) ---
app.kafka.enabled=${APP_KAFKA_ENABLED:true}
app.kafka.notification-topic=${KAFKA_NOTIFICATION_TOPIC:bankone.notifications}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${APP_KAFKA_ENABLED:true}
spring.kafka.consumer.group-id=bankone-notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bankone.notification
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.bankone.notification.dto.BankActionEvent
# Local Docker Kafka = PLAINTEXT. Aiven/Render: SASL_SSL + SCRAM + CA cert.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
# Aiven: paste project CA PEM (-----BEGIN CERTIFICATE----- ...). Leave empty locally.
spring.kafka.ssl.trust-store-type=${KAFKA_SSL_TRUSTSTORE_TYPE:}
spring.kafka.ssl.trust-store-certificates=${KAFKA_CA_CERT:}

# --- Mail: local Mailpit (smtp); Render: SendGrid HTTP (sendgrid) ---
# Prefer APP_MAIL_TRANSPORT on Render (maps cleanly). MAIL_TRANSPORT also works via placeholder.
app.mail.transport=${APP_MAIL_TRANSPORT:${MAIL_TRANSPORT:smtp}}
app.mail.sendgrid-api-key=${SENDGRID_API_KEY:${MAIL_PASSWORD:}}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@bankone.local}
app.mail.notify-to=${MAIL_NOTIFY_TO:ops@bankone.local}
