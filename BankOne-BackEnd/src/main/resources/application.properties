spring.application.name=BankOne

# Override with env vars in cloud / Docker (see .env.example / docs/DEPLOY.md)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bankone_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BankOne@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Instant/OffsetDateTime already serialize as ISO-8601 with Z (UTC).
# Do not set spring.jackson.serialization.write-dates-as-timestamps —
# Spring Boot 4 / Jackson 3 rejects that legacy property and the app fails to start.
spring.jackson.time-zone=UTC

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# Cloud hosts often set PORT
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:ReplaceThisWithAVeryLongRandomSecretKeyAtLeast32CharactersLong}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Comma-separated origin patterns for CORS
app.cors.allowed-origin-patterns=${APP_CORS_ORIGINS:http://localhost:*,http://bankone.local:*,http://192.168.0.4:*}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LEVEL:TRACE}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}


# --- Kafka notifications (Liberty local; override on Render with env) ---
# Default false so local Liberty stays fast when Docker Kafka is not running.
# Enable with APP_KAFKA_ENABLED=true after: docker compose up -d kafka mailpit
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
app.kafka.notification-topic=${KAFKA_NOTIFICATION_TOPIC:bankone.notifications}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=${APP_KAFKA_ENABLED:false}
spring.kafka.consumer.group-id=bankone-notification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bankone.notification
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.bankone.notification.dto.BankActionEvent
# Fail soft quickly if broker is unreachable (default max.block.ms is 60000).
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:1500}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:2000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:3000}
spring.kafka.producer.properties.acks=1
spring.kafka.producer.properties.linger.ms=0
# Local Docker Kafka = PLAINTEXT. Aiven/Render: SASL_SSL + SCRAM + CA cert.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
# Aiven: paste project CA PEM (-----BEGIN CERTIFICATE----- ...). Leave empty locally.
spring.kafka.ssl.trust-store-type=${KAFKA_SSL_TRUSTSTORE_TYPE:}
spring.kafka.ssl.trust-store-certificates=${KAFKA_CA_CERT:}

# --- Mail: local Mailpit (smtp); Render: SendGrid HTTP (sendgrid) ---
# Prefer APP_MAIL_TRANSPORT on Render (maps cleanly). MAIL_TRANSPORT also works via placeholder.
app.mail.transport=${APP_MAIL_TRANSPORT:${MAIL_TRANSPORT:smtp}}
app.mail.sendgrid-api-key=${SENDGRID_API_KEY:${MAIL_PASSWORD:}}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@bankone.local}
app.mail.from-name=${MAIL_FROM_NAME:BankOne}
app.mail.notify-to=${MAIL_NOTIFY_TO:ops@bankone.local}



# --- Rate limiting (learning; Redis shared buckets locally) ---
# Master switch
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
# Redis only when true (local). Render: leave false / unset.
app.rate-limit.redis-enabled=${APP_RATE_LIMIT_REDIS:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# JPA repos only — do not treat Spring Data interfaces as Redis repositories
spring.data.redis.repositories.enabled=false

# --- Entity / API response cache-aside (local learning; off in prod) ---
app.cache.redis-enabled=${APP_CACHE_REDIS:true}
app.cache.ttl-seconds=${APP_CACHE_TTL_SECONDS:300}
# Limits (token bucket capacity = refill per minute for learning)
app.rate-limit.login-per-minute=${APP_RATE_LIMIT_LOGIN:10}
app.rate-limit.api-per-minute=${APP_RATE_LIMIT_API:120}

# --- Sharding lab (2 local DBs; UUID vertical slice — not live customers/accounts) ---
app.sharding.enabled=${APP_SHARDING_ENABLED:true}
app.sharding.shard-count=2
app.sharding.username=${SPRING_DATASOURCE_USERNAME:bankone_user}
app.sharding.password=${SPRING_DATASOURCE_PASSWORD:BankOne@123}
app.sharding.s0-url=${APP_SHARD_S0_URL:jdbc:postgresql://localhost:5432/bankone_s0}
app.sharding.s1-url=${APP_SHARD_S1_URL:jdbc:postgresql://localhost:5432/bankone_s1}

# --- Primary / read replica lab (writes → bankone, reads → bankone_read) ---
app.replica.enabled=${APP_REPLICA_ENABLED:true}
app.replica.read-url=${APP_REPLICA_READ_URL:jdbc:postgresql://localhost:5432/bankone_read}
app.replica.sync-ms=${APP_REPLICA_SYNC_MS:120000}
app.replica.username=${SPRING_DATASOURCE_USERNAME:bankone_user}
app.replica.password=${SPRING_DATASOURCE_PASSWORD:BankOne@123}
app.replica.include-audit=${APP_REPLICA_INCLUDE_AUDIT:false}