# Activate with: SPRING_PROFILES_ACTIVE=prod
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# Console-only logging is configured in logback-spring.xml (prod profile).
# Do not write rolling files on Render — ephemeral/read-only paths break Logback.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.com.bankone.common.config.DataSourceConfig=INFO
logging.level.org.apache.catalina=INFO
logging.level.org.apache.tomcat=INFO
