# Local full stack: Postgres + API + Angular (nginx)
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# API:  http://localhost:8080
# UI:   http://localhost:8081

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankone}
      POSTGRES_USER: ${POSTGRES_USER:-bankone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BankOne@123}
    ports:
      - "5432:5432"
    volumes:
      - bankone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankone_user} -d ${POSTGRES_DB:-bankone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./BankOne-BackEnd
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bankone}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankone_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-BankOne@123}
      JWT_SECRET: ${JWT_SECRET:-ReplaceThisWithAVeryLongRandomSecretKeyAtLeast32CharactersLong}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      PORT: 8080
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./BankOne-Frontend
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "8081:80"
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP (app sends mail here)
      - "8025:8025"   # Web inbox (you open in browser)
volumes:
  bankone_pg:
  bankone_kafka:
