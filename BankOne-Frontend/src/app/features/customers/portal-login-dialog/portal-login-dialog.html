<h2 mat-dialog-title>Enable customer portal login</h2>

<mat-dialog-content>
  <p class="helper">
    Creates a login for
    <strong>{{ customer.firstName }} {{ customer.lastName }}</strong>
    that can only view their own accounts — not the staff dashboard.
  </p>

  <form class="form">
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput name="firstName" [(ngModel)]="firstName" required>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput name="lastName" [(ngModel)]="lastName" required>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Username</mat-label>
      <input matInput name="username" [(ngModel)]="username" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Temporary password</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="email" required>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="saving()">
    {{ saving() ? 'Creating...' : 'Create portal login' }}
  </button>
</mat-dialog-actions>
