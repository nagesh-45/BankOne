<h2 mat-dialog-title>
  Edit policy — {{ data.policy.accountType }} / {{ data.policy.currencyCode }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="policy-form" (ngSubmit)="save()">
    <mat-checkbox formControlName="openingDepositRequired">
      Opening deposit required
    </mat-checkbox>

    <mat-form-field appearance="outline">
      <mat-label>Required opening deposit</mat-label>
      <input matInput type="number" step="0.01" formControlName="requiredOpeningDeposit">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Minimum balance</mat-label>
      <input matInput type="number" step="0.01" formControlName="minimumBalance">
    </mat-form-field>

    <mat-checkbox formControlName="active">Active</mat-checkbox>

    <mat-form-field appearance="outline">
      <mat-label>Effective from</mat-label>
      <input matInput type="datetime-local" formControlName="effectiveFrom">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Effective to (optional)</mat-label>
      <input matInput type="datetime-local" formControlName="effectiveTo">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving">
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
